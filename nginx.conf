server {
    listen 8080;                  # Use 8080 for OpenShift non-root
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;  # For React Router SPA
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
